<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>镜序 · 团队审阅</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("mirrororder-team-theme");
          const theme = saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script type="module" crossorigin src="/team/assets/team-review.js"></script>
    <link rel="stylesheet" crossorigin href="/team/assets/team-review.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
