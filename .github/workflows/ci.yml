name: MirrorOrder CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile Python
        run: python -m py_compile src/script_organizer/*.py tests/*.py
      - name: Run tests
        run: python -m pytest -q

  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin npm for Arborist stability
        run: npm install --global npm@11.6.0 --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for layout runtime checks
        working-directory: desktop
        run: npx playwright install --with-deps chromium
      - name: Prepare Tauri icons
        working-directory: desktop
        run: npm run prepare:icons
      - name: Check development baseline
        working-directory: desktop
        run: npm run check:baseline
      - name: Check UI authority
        working-directory: desktop
        run: npm run check:ui-authority
      - name: Typecheck Desktop
        working-directory: desktop
        run: npm run typecheck
      - name: Test Desktop
        working-directory: desktop
        run: npm test
      - name: Test Desktop layout runtime
        working-directory: desktop
        run: npm run test:layout-runtime
      - name: Test real UX gate against synthetic review media
        working-directory: desktop
        run: npm run test:ux-real
      - name: Upload layout runtime screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-layout-runtime
          path: desktop/artifacts/layout-runtime/
          if-no-files-found: ignore
      - name: Build Desktop frontend
        working-directory: desktop
        run: npm run build
      - name: Test Timeline Core
        run: cargo test --manifest-path desktop/src-tauri/crates/timeline-core/Cargo.toml
      - name: Test Tauri Host
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Check Tauri Host
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

  desktop-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin npm for Arborist stability
        run: npm install --global npm@11.6.0 --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Prepare Tauri icons
        working-directory: desktop
        run: npm run prepare:icons
      - name: Build Desktop frontend
        working-directory: desktop
        run: npm run build
      - name: Test Timeline Core
        run: cargo test --manifest-path desktop/src-tauri/crates/timeline-core/Cargo.toml
      - name: Test Tauri Host
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Check Tauri Host
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
