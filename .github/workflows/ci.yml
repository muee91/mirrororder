name: MirrorOrder CI

on:
  push:
    branches: [main, feat/desktop-v2-tauri]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile Python
        run: python -m py_compile src/script_organizer/*.py tests/*.py
      - name: Run tests
        run: python -m pytest -q

  desktop-v2-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Desktop dependencies
        working-directory: desktop-v2
        run: npm install --no-audit --no-fund
      - name: Typecheck Desktop
        working-directory: desktop-v2
        run: npm run typecheck
      - name: Test Desktop
        working-directory: desktop-v2
        run: npm test
      - name: Build Desktop frontend
        working-directory: desktop-v2
        run: npm run build
      - name: Test Timeline Core
        run: cargo test --manifest-path desktop-v2/src-tauri/crates/timeline-core/Cargo.toml
      - name: Test Tauri Host
        run: cargo test --manifest-path desktop-v2/src-tauri/Cargo.toml
      - name: Check Tauri Host
        run: cargo check --manifest-path desktop-v2/src-tauri/Cargo.toml

  macos-app-smoke:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: python3 -m py_compile src/script_organizer/*.py tests/*.py
      - name: Build app
        run: zsh macos-app/build_app.sh
      - name: Verify app bundle
        run: |
          test -x '镜序.app/Contents/MacOS/MaterialWorkspace'
          file '镜序.app/Contents/MacOS/MaterialWorkspace'
          plutil -lint '镜序.app/Contents/Info.plist'
          codesign --verify --deep --strict '镜序.app'
