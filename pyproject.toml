[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "script-material-organizer"
version = "0.1.0"
description = "Local, script-driven multicamera material organizer for editors"
requires-python = ">=3.11"

[project.optional-dependencies]
auto-score-beats = ["beat-this>=1.1,<2"]

[project.scripts]
script-organizer = "script_organizer.cli:main"
script-organizer-mcp = "script_organizer.mcp_server:main"
mirrororder-auto-score = "script_organizer.music.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
