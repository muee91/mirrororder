[package]
name = "mirrororder-desktop-v2"
version = "0.1.0"
description = "MirrorOrder cross-platform desktop host"
authors = ["MirrorOrder"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mirrororder-timeline-core = { path = "crates/timeline-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
